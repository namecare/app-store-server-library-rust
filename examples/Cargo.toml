[package]
name = "app-store-server-library-examples"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Runnable examples for app-store-server-library"

[dependencies]
app-store-server-library = { path = "..", features = ["rust_crypto"] }

axum = "0.8"
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[[bin]]
name = "axum_server"
path = "src/axum_server.rs"

[[bin]]
name = "actix_server"
path = "src/actix_server.rs"
