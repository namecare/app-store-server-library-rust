[package]
name = "app-store-server-library-examples"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Runnable examples for app-store-server-library"

[dependencies]
app-store-server-library = { path = "..", features = ["aws_lc"] }

axum = "0.8.9"
actix-web = "4.18.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[[bin]]
name = "axum_server"
path = "src/axum_server.rs"

[[bin]]
name = "actix_server"
path = "src/actix_server.rs"
