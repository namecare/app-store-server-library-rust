[package]
name = "app-store-server-library"
description = "The Rust server library for the App Store Server API, App Store Server Notifications and Advanced Commerce API"
version = "6.0.0"
repository = "https://github.com/namecare/app-store-server-library-rust"
homepage = "https://github.com/namecare/app-store-server-library-rust"
authors = ["tkhp", "namecare"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/app-store-server-library"
keywords = ["apple", "appstore", "appstore-server-api", "appstore-receipt", "advanced-commerce"]
edition = "2021"
# Kept in step with the MSRV job in .github/workflows/build_test.yml. The
# crate's own source builds on less; the floor comes from `time` (reached
# transitively via asn1-rs), which requires 1.88.
rust-version = "1.88"

[dependencies]

x509-validator = { version = "0.1.0", default-features = false }

# Cryptography - RustCrypto backend (optional)
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"], optional = true }
p384 = { version = "0.14.0", features = ["ecdsa"], optional = true }
rsa = { version = "0.10.0-rc.18", optional = true }
sha2 = { version = "0.11.0", features = ["oid"], optional = true }
pem-rfc7468 = { version = "1.0.0", optional = true }
signature = { version = "3.0.0", optional = true }

# Cryptography - AWS-LC backend (optional)
aws-lc-rs = { version = "1.18.0", optional = true }

# Cryptography - ring backend (optional)
ring = { version = "0.17.14", optional = true }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde_with = { version = "3.21.0", features = ["chrono"] }
serde_repr = "0.1.21"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.0"
asn1-rs = { version = "0.7.2", optional = true }

# Networking
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "http2",
  "blocking",
], optional = true }
http = { version = "1.5.0", optional = true }

# Utils
thiserror = "2.0.19"

# Tools
regex = { version = "1.13.1", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros"] }

[features]
default = []

rust_crypto = [
  "dep:pem-rfc7468",
  "dep:p256",
  "dep:p384",
  "dep:rsa",
  "dep:sha2",
  "dep:signature",
  "x509-validator/rust_crypto",
]
aws_lc = ["dep:aws-lc-rs", "dep:asn1-rs", "x509-validator/aws_lc"]
ring = ["dep:ring", "dep:asn1-rs", "x509-validator/ring"]

api-client = ["dep:http"]
api-client-reqwest = ["api-client", "dep:reqwest", "reqwest-tls-rustls"]
api-client-reqwest-native-tls = ["api-client", "dep:reqwest", "reqwest-tls-native"]
# reqwest TLS backend markers; the reqwest transport asserts one is set.
reqwest-tls-rustls = ["reqwest/rustls"]
reqwest-tls-native = ["reqwest/native-tls"]
receipt-utility = ["dep:regex", "dep:asn1-rs"]

[[test]]
name = "app_store_server_api_client"
path = "tests/app_store_server_api_client.rs"
required-features = ["api-client"]

[[test]]
name = "advanced_commerce_api_client"
path = "tests/advanced_commerce_api_client.rs"
required-features = ["api-client"]

# These reach `CryptoProvider::default_provider()`, which panics when no
# backend is enabled, so they are meaningless in the backend-free build.
# Cargo has no "any of these features" form, so each file is declared once
# per backend; with no backend every copy is skipped, which is the intent.
[[test]]
name = "crypto_provider_rust_crypto"
path = "tests/crypto_provider.rs"
required-features = ["rust_crypto"]

[[test]]
name = "crypto_provider_aws_lc"
path = "tests/crypto_provider.rs"
required-features = ["aws_lc"]

[[test]]
name = "crypto_provider_ring"
path = "tests/crypto_provider.rs"
required-features = ["ring"]

[[test]]
name = "jws_signature_creator_rust_crypto"
path = "tests/jws_signature_creator.rs"
required-features = ["rust_crypto"]

[[test]]
name = "jws_signature_creator_aws_lc"
path = "tests/jws_signature_creator.rs"
required-features = ["aws_lc"]

[[test]]
name = "jws_signature_creator_ring"
path = "tests/jws_signature_creator.rs"
required-features = ["ring"]

[[test]]
name = "promotional_offer_signature_creator_rust_crypto"
path = "tests/promotional_offer_signature_creator.rs"
required-features = ["rust_crypto"]

[[test]]
name = "promotional_offer_signature_creator_aws_lc"
path = "tests/promotional_offer_signature_creator.rs"
required-features = ["aws_lc"]

[[test]]
name = "promotional_offer_signature_creator_ring"
path = "tests/promotional_offer_signature_creator.rs"
required-features = ["ring"]

[[test]]
name = "signed_data_verifier_rust_crypto"
path = "tests/signed_data_verifier.rs"
required-features = ["rust_crypto"]

[[test]]
name = "signed_data_verifier_aws_lc"
path = "tests/signed_data_verifier.rs"
required-features = ["aws_lc"]

[[test]]
name = "signed_data_verifier_ring"
path = "tests/signed_data_verifier.rs"
required-features = ["ring"]

[workspace]
members = ["bench/measure", "bench/compare"]
exclude = ["examples"]

# The bench crates are not published and their lockfile entries should not
# constrain the library's. Resolver 2 keeps their dev-dependency features
# from unifying into the library's build.
resolver = "2"
