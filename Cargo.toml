[package]
name = "app-store-server-library"
description = "The Rust server library for the App Store Server API, App Store Server Notifications and Advanced Commerce API"
version = "6.0.0"
repository = "https://github.com/namecare/app-store-server-library-rust"
homepage = "https://github.com/namecare/app-store-server-library-rust"
authors = ["tkhp", "namecare"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/app-store-server-library"
keywords = ["apple", "appstore", "appstore-server-api", "appstore-receipt", "advanced-commerce"]
edition = "2021"

[dependencies]

# Cryptography - RustCrypto backend (optional)
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"], optional = true }
p384 = { version = "0.13.1", features = ["ecdsa"], optional = true }
rsa = { version = "0.9.10", optional = true }
sha2 = { version = "0.10.9", features = ["oid"], optional = true }
pem-rfc7468 = {  version = "1.0.0", optional = true }
der = { version = "0.7.10", features = ["alloc", "oid", "bytes"], optional = true }
x509-cert = { version = "0.2.5", features = ["std"], optional = true }
x509-ocsp = { version = "0.2.1", optional = true, features = ["builder", "std"] }
const-oid = { version = "0.9.6", optional = true }
sha1 = { version = "0.10.7", features = ["oid"], optional = true }
signature = { version = "2.2.0", optional = true }


# Cryptography - AWS-LC backend (optional)
aws-lc-rs = { version = "1.17.3", optional = true }
aws-lc-sys = { version = "0.43.0", optional = true }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde_with = { version = "3.21.0", features = ["chrono"] }
serde_repr = "0.1.21"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.0"

# Networking
reqwest = { version = "0.13.4", default-features = false, features = ["json", "http2", "blocking"], optional = true }
http = { version = "1.5.0", optional = true }

# Utils
thiserror = "2.0.19"

# Tools
regex = { version = "1.13.1", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros"] }

[features]
default = ["rust_crypto"]

rust_crypto = ["dep:pem-rfc7468", "dep:p256", "dep:p384", "dep:rsa", "dep:der", "dep:x509-cert", "dep:x509-ocsp", "dep:const-oid", "dep:sha1", "dep:sha2", "dep:signature"]
aws_lc = ["dep:aws-lc-rs", "dep:aws-lc-sys"]

api-client = ["dep:http"]
api-client-reqwest = ["api-client", "dep:reqwest", "reqwest-tls-rustls"]
api-client-reqwest-native-tls = ["api-client", "dep:reqwest", "reqwest-tls-native"]
# reqwest TLS backend markers; the reqwest transport asserts one is set.
reqwest-tls-rustls = ["reqwest/rustls"]
reqwest-tls-native = ["reqwest/native-tls"]
receipt-utility = ["dep:regex"]

[[test]]
name = "app_store_server_api_client"
path = "tests/app_store_server_api_client.rs"
required-features = ["api-client"]

[[test]]
name = "advanced_commerce_api_client"
path = "tests/advanced_commerce_api_client.rs"
required-features = ["api-client"]

[[test]]
name = "chain_verifier_ocsp"
path = "tests/chain_verifier_ocsp.rs"
required-features = ["ocsp"]