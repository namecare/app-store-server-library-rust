[package]
name = "app-store-server-library-bench-compare"
description = "Cross-language comparison benchmarks for app-store-server-library. Not published."
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Same backend pin as `measure`, so the Rust in the cross-language table is
# the same Rust that CI tracks.
app-store-server-library = { path = "../..", default-features = false, features = ["aws_lc", "receipt-utility"] }
uuid = { version = "1.24.0", features = ["v4"] }

# No benchmark harness here, deliberately. This crate's job is to run the same
# workload four ways and report one comparable number per cell, so the Rust arm
# is a plain `std::time::Instant` loop in src/bin/runner.rs with exactly the
# shape the Swift, Node and Python runners use: warm up, time each iteration,
# take the median. A harness would give the Rust column its own sampling
# strategy and its own output format to scrape — two ways for it to stop
# meaning the same thing as its neighbours.
#
# Statistical depth lives in `bench/measure`, which uses criterion and is the
# suite that actually tracks change over time.
