name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crypto_backend: [rust_crypto, aws_lc]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build (${{ matrix.crypto_backend }} on ${{ matrix.os }})
      run: cargo build --verbose --no-default-features --features ${{ matrix.crypto_backend }}

    - name: Run tests (${{ matrix.crypto_backend }} on ${{ matrix.os }})
      run: cargo test --verbose --no-default-features --features ${{ matrix.crypto_backend }},api-client,receipt-utility

  ocsp:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run tests (ocsp with rust_crypto)
      run: cargo test --verbose --no-default-features --features rust_crypto,ocsp
